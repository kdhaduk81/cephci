---
# Isolated suite for mon_rm_add test with debug logging and crash detection.
# Use with conf: conf/tentacle/cephfs/tier-2_cephfs_7-node-cluster.yaml
#
# Purpose: Reproduce and investigate the cephadm OSD deactivation bug triggered
# by rapid mon removal/re-addition (monmap change).
######################################################################################################################
tests:
  - test:
      abort-on-fail: true
      desc: "Setup phase to deploy the required pre-requisites for running the tests."
      module: install_prereq.py
      name: "setup install pre-requisites"
  - test:
      name: cluster deployment
      desc: Execute the cluster deployment workflow.
      module: test_cephadm.py
      polarion-id:
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              base_cmd_args:
                verbose: true
              args:
                mon-ip: node1
                orphan-initial-daemons: true
                skip-monitoring-stack: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: shell
              args:
                - ceph
                - fs
                - volume
                - create
                - cephfs
          - config:
              command: apply
              service: mds
              base_cmd_args:
                verbose: true
              pos_args:
                - cephfs
              args:
                placement:
                  label: mds
          - config:
              args:
                - ceph
                - fs
                - set
                - cephfs
                - max_mds
                - "2"
              command: shell
      destroy-cluster: false
      abort-on-fail: true
  - test:
      abort-on-fail: true
      config:
        command: add
        copy_admin_keyring: true
        id: client.1
        install_packages:
          - ceph-common
          - ceph-fuse
        node: node8
      desc: "Configure the Cephfs client system 1"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"
  -
    test:
      abort-on-fail: false
      desc: "Enable ceph debug logs"
      module: cephfs_logs_util.py
      name: cephfs-enable-logs
      config:
        ENABLE_LOGS: 1
        daemon_list: ['mds', 'client', 'osd', 'mgr', 'mon']
        daemon_dbg_level: {'mds': 10, 'client': 10, 'osd': 5, 'mgr': 5, 'mon': 5}
  - test:
      abort-on-fail: false
      desc: "Set size limit for log rotation"
      name: size limit for log rotation
      module: cephfs_logs_util.py
      config:
        LOG_ROTATE_SIZE: 1
        log_size: '200M'
  -
    test:
      abort-on-fail: false
      desc: "Setup Crash configuration"
      module: cephfs_crash_util.py
      name: cephfs-crash-setup
      config:
        crash_setup: 1
        daemon_list: ['mds', 'osd', 'mgr', 'mon']
  - test:
      name: mon service add removal test
      module: mon_rm_add.py
      polarion-id: CEPH-11345
      desc: mon service add removal test
      abort-on-fail: false
  -
    test:
      abort-on-fail: false
      desc: "Check for Crash"
      module: cephfs_crash_util.py
      name: cephfs-crash-check
      config:
        crash_check: 1
        daemon_list: ['mds', 'osd', 'mgr', 'mon']
  -
    test:
      abort-on-fail: false
      desc: "Disable ceph debug logs"
      module: cephfs_logs_util.py
      name: cephfs-disable-logs
      config:
        DISABLE_LOGS: 1
        daemon_list: ['mds', 'client', 'osd', 'mgr', 'mon']
