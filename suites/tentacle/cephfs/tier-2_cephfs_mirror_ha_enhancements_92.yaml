#===============================================================================================
# Tier-level: 2
# Test-Suite: tier-2_cephfs_mirror_ha_enhancements_92.yaml
# Test-Case: CephFS Mirroring 9.2 Enhancements — 2-Daemon HA Functional Suite
#
# Covers:
#   - Stats continuity for redistributed directories
#   - Multi-daemon stat accuracy & filesystem isolation (cephfs vs cephfs2)
#   - MGR interface reports all directories after daemon redistribution
#   - HA failover preserves checkpoint state (transitions to COMPLETE)
#   - Multi-daemon perf dump isolation (cephfs_mirror_directory non-overlapping)
#   - Perf counters for redistributed directories (instantiated from 0 on takeover)
#   - Tri-interface consistency after HA failover & daemon restart
#
# Cluster Configuration:
#    No of Clusters : 2
#    Cluster 1 :
#    3 MONS, 2 MGR, 2 MDS, 3 OSD and 2 CEPHFS MIRROR, 1 Client
#     Node1 - Mon, Mgr, Installer
#     Node2 - Mon, Mgr
#     Node3 - Mon, OSD
#     Node4 - OSD, MDS
#     Node5 - OSD, MDS
#     Node6 - CephFS Mirror
#     Node7 - CephFS Mirror
#     Node8 - Client
#    Cluster 2 :
#    3 MONS, 2 MGR, 2 MDS, 3 OSD and 1 Client
#     Node1 - Mon, Mgr, Installer
#     Node2 - Mon, Mgr
#     Node3 - Mon, OSD
#     Node4 - OSD, MDS
#     Node5 - OSD, MDS
#     Node6 - Client
#===============================================================================================
tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true
  - test:
      abort-on-fail: true
      clusters:
        ceph1:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: bootstrap
                  service: cephadm
                  args:
                    registry-url: registry.redhat.io
                    mon-ip: node1
                    orphan-initial-daemons: true
                    skip-monitoring-stack: true
              - config:
                  command: add_hosts
                  service: host
                  args:
                    attach_ip_address: true
                    labels: apply-all-labels
              - config:
                  command: apply
                  service: mgr
                  args:
                    placement:
                      label: mgr
              - config:
                  command: apply
                  service: mon
                  args:
                    placement:
                      label: mon
              - config:
                  command: apply
                  service: osd
                  args:
                    all-available-devices: true
              - config:
                  command: shell
                  args:
                    - "ceph fs volume create cephfs"
              - config:
                  command: apply
                  service: mds
                  base_cmd_args:
                    verbose: true
                  pos_args:
                    - cephfs
                  args:
                    placement:
                      nodes:
                        - node4
                        - node5
              - config:
                  command: apply
                  service: cephfs-mirror
                  args:
                    placement:
                      nodes:
                        - node6
                        - node7
        ceph2:
          config:
            verify_cluster_health: true
            steps:
              - config:
                  command: bootstrap
                  service: cephadm
                  args:
                    registry-url: registry.redhat.io
                    mon-ip: node1
                    orphan-initial-daemons: true
                    skip-monitoring-stack: true
              - config:
                  command: add_hosts
                  service: host
                  args:
                    attach_ip_address: true
                    labels: apply-all-labels
              - config:
                  command: apply
                  service: mgr
                  args:
                    placement:
                      label: mgr
              - config:
                  command: apply
                  service: mon
                  args:
                    placement:
                      label: mon
              - config:
                  command: apply
                  service: osd
                  args:
                    all-available-devices: true
              - config:
                  command: shell
                  args:
                    - "ceph fs volume create cephfs"
              - config:
                  command: apply
                  service: mds
                  base_cmd_args:
                    verbose: true
                  pos_args:
                    - cephfs
                  args:
                    placement:
                      nodes:
                        - node4
                        - node5
      desc: CephFS Mirror HA cluster deployment using cephadm
      destroy-cluster: false
      module: test_cephadm.py
      polarion-id: CEPH-83574114
      name: deploy cephfs-mirror ha clusters
  - test:
      abort-on-fail: true
      clusters:
        ceph1:
          config:
            command: add
            copy_admin_keyring: true
            id: client.1
            install_packages:
              - ceph-common
              - ceph-fuse
            node: node8
        ceph2:
          config:
            command: add
            copy_admin_keyring: true
            id: client.1
            install_packages:
              - ceph-common
              - ceph-fuse
            node: node6
      desc: "Configure the CephFS clients"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"

  - test:
      abort-on-fail: false
      desc: "Validate 2-daemon HA mirroring enhancements for 9.2 (stats continuity, multi-FS isolation, checkpoints failover, perf isolation, tri-interface)"
      clusters:
        ceph1:
          config:
            name: Validate CephFS Mirroring HA enhancements for 9.2
      module: cephfs_mirroring.test_cephfs_mirror_ha_92.py
      name: Validate CephFS Mirroring HA enhancements for 9.2
      polarion-id: "CEPH-83632850"
