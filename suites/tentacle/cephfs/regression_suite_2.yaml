---
######################################################################################################################
# CephFS Functional Test Suite – YAML Overview
#
# Suites Covered :
#     - cephfs_cg_quiesce
#     - snapshot-clone
#     - clients
######################################################################################################################
tests:
  - test:
      abort-on-fail: true
      desc: "Setup phase to deploy the required pre-requisites for running the tests."
      module: install_prereq.py
      name: "setup install pre-requisistes"
  - test:
      name: cluster deployment
      desc: Execute the cluster deployment workflow.
      module: test_cephadm.py
      polarion-id:
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              base_cmd_args:
                verbose: true
              args:
                mon-ip: node1
                orphan-initial-daemons: true
                skip-monitoring-stack: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: shell
              args: # arguments to ceph orch
                - ceph
                - fs
                - volume
                - create
                - cephfs
          - config:
              command: shell
              args:
                - ceph
                - osd
                - pool
                - create
                - cephfs-data-ec
                - "64"
                - erasure
          - config:
              command: shell
              args:
                - ceph
                - osd
                - pool
                - create
                - cephfs-metadata
                - "64"
          - config:
              command: shell
              args:
                - ceph
                - osd
                - pool
                - set
                - cephfs-data-ec
                - allow_ec_overwrites
                - "true"
          - config:
              command: shell
              args: # arguments to ceph orch
                - ceph
                - fs
                - new
                - cephfs-ec
                - cephfs-metadata
                - cephfs-data-ec
                - --force
          - config:
              command: apply
              service: mds
              base_cmd_args: # arguments to ceph orch
                verbose: true
              pos_args:
                - cephfs # name of the filesystem
              args:
                placement:
                  label: mds
          - config:
              args:
                - ceph
                - fs
                - set
                - cephfs
                - max_mds
                - "2"
              command: shell
      destroy-cluster: false
      abort-on-fail: true
  - test:
      abort-on-fail: true
      config:
        command: add
        copy_admin_keyring: true
        id: client.1
        install_packages:
          - ceph-common
          - ceph-fuse
        node: node8
      desc: "Configure the Cephfs client system 1"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"
  - test:
      abort-on-fail: true
      config:
        command: add
        copy_admin_keyring: true
        id: client.2
        install_packages:
          - ceph-common
          - ceph-fuse
        node: node9
      desc: "Configure the Cephfs client system 2"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"
  - test:
      abort-on-fail: true
      config:
        command: add
        copy_admin_keyring: true
        id: client.3
        install_packages:
          - ceph-common
          - ceph-fuse
        node: node10
      desc: "Configure the Cephfs client system 3"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"
  - test:
      abort-on-fail: true
      config:
        command: add
        copy_admin_keyring: true
        id: client.4
        install_packages:
          - ceph-common
          - ceph-fuse
        node: node11
      desc: "Configure the Cephfs client system 4"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"
  ######################################################################################################################
  # RERUN 9.1 (20.2.1-324): Only keeping failed tests + MDS failover/config for investigation
  # Added crash module, debug logs, and ceph health checks around MDS tests
  ######################################################################################################################
  - test:
      abort-on-fail: false
      desc: "Enable crash module and set debug levels for MDS investigation"
      module: cephfs_logs_util.py
      name: cephfs-enable-logs
      config:
        ENABLE_LOGS: 1
        daemon_list: [ "mds", "client" ]
        daemon_dbg_level: { "mds": 20, "client": 10 }
  - test:
      abort-on-fail: false
      desc: "Enable crash module for MDS crash collection"
      module: test_cephadm.py
      config:
        verify_cluster_health: false
        steps:
          - config:
              command: shell
              args:
                - ceph
                - mgr
                - module
                - enable
                - crash
          - config:
              command: shell
              args:
                - ceph
                - crash
                - prune
                - "0"
      name: "Enable crash module"
  - test:
      abort-on-fail: false
      desc: "Check ceph health BEFORE MDS failover test"
      module: test_cephadm.py
      config:
        verify_cluster_health: false
        steps:
          - config:
              command: shell
              args:
                - ceph
                - health
                - detail
          - config:
              command: shell
              args:
                - ceph
                - fs
                - status
          - config:
              command: shell
              args:
                - ceph
                - mds
                - stat
      name: "Health check BEFORE MDS failover"
  - test:
      abort-on-fail: false
      desc: "MDS failover while IO is going on each client"
      module: clients.MDS_failover_while_client_IO.py
      polarion-id: CEPH-11242
      config:
        num_of_file_dir: 1000
      name: "MDS failover whi client IO"
  - test:
      abort-on-fail: false
      desc: "Check ceph health AFTER MDS failover test"
      module: test_cephadm.py
      config:
        verify_cluster_health: false
        steps:
          - config:
              command: shell
              args:
                - ceph
                - health
                - detail
          - config:
              command: shell
              args:
                - ceph
                - fs
                - status
          - config:
              command: shell
              args:
                - ceph
                - mds
                - stat
          - config:
              command: shell
              args:
                - ceph
                - crash
                - ls
      name: "Health check AFTER MDS failover"
  - test:
      name: Test important MDS Configuration Settings
      module: clients.mds_conf_modifying.py
      polarion-id: CEPH-11329
      desc: Test important MDS Configuration Settings
      abort-on-fail: false
  - test:
      abort-on-fail: false
      desc: "Check ceph health AFTER MDS Configuration Settings test"
      module: test_cephadm.py
      config:
        verify_cluster_health: false
        steps:
          - config:
              command: shell
              args:
                - ceph
                - health
                - detail
          - config:
              command: shell
              args:
                - ceph
                - fs
                - status
          - config:
              command: shell
              args:
                - ceph
                - mds
                - stat
          - config:
              command: shell
              args:
                - ceph
                - crash
                - ls
      name: "Health check AFTER MDS config test"
  - test:
      abort-on-fail: false
      desc: "multiple clients permission in mounted directory"
      module: clients.multiple_clients_permission_mounted_directories.py
      name: multiple clients permission in mounted directory
      polarion-id: "CEPH-11340"
  - test:
      abort-on-fail: false
      desc: "mds journal value conf verification"
      module: clients.mds_journal_value_conf_verification.py
      name: mds journal value conf verification
      polarion-id: "CEPH-11331"
  - test:
      abort-on-fail: false
      desc: "Validate Root Sqaush operations on Cephfs"
      module: clients.validate_root_squash.py
      name: Validate Root Sqaush operations on Cephfs
      comments: "BZ-2293943"
      polarion-id: "CEPH-83591419"
  - test:
      abort-on-fail: false
      desc: "Client Caps Validation during quiesce,mds failover and evict"
      module: clients.client_caps_update_validation.py
      name: client_caps_update_validation
      polarion-id: "CEPH-83597462"
  - test:
      abort-on-fail: false
      desc: "Disable ceph debug logs"
      module: cephfs_logs_util.py
      name: cephfs-disable-logs
      config:
        DISABLE_LOGS: 1
        daemon_list: [ "mds", "client" ]
  - test:
      abort-on-fail: true
      desc: "Setup phase to deploy the required pre-requisites for running the tests."
      module: cephfs_clean_up.py
      name: "setup Cleanup after the test suite"
