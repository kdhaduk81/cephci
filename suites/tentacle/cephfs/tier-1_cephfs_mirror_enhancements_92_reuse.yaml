#===============================================================================================
# Tier-level: 1 (reuse)
# Test-Suite: tier-1_cephfs_mirror_enhancements_92_reuse.yaml
# Test-Case: CephFS Mirroring 9.2 Enhancements — Functional Tests (reuse run)
#
# Use this suite with --reuse when the cluster is already deployed.
# It skips install_prereq and cephadm bootstrap steps and goes directly
# to configure client → setup mirroring → tests → teardown.
#
# Covers:
#   - Improved Stats: R1, R2, R5, R7, R12, R16 (dual asok + MGR validation)
#   - Disruptive Ops: R8 (sync failure, recovery), S9 (mid-sync daemon restart)
#   - Table 0: Asok Metrics — 12 scenarios
#   - Table 1: MGR Interface — 10 scenarios
#   - Table 2: Checkpoints — 6 scenarios
#   - Table 3: Perf Dumps — 6 scenarios
#   - Table 4: Tri-Interface — 4 scenarios
#
# Cluster Configuration:
#    No of Clusters : 2
#    Cluster 1 :
#    3 MONS, 2 MGR, 2 MDS, 3 OSD and 1 CEPHFS MIRROR, 1 Client
#     Node1 - Mon, Mgr, Installer
#     Node2 - Mon, Mgr
#     Node3 - Mon, OSD
#     Node4 - OSD, MDS
#     Node5 - OSD, MDS
#     Node6 - CephFS Mirror
#     Node7 - Client
#    Cluster 2 :
#    3 MONS, 2 MGR, 2 MDS, 3 OSD and 1 Client
#     Node1 - Mon, Mgr, Installer
#     Node2 - Mon, Mgr
#     Node3 - Mon, OSD
#     Node4 - OSD, MDS
#     Node5 - OSD, MDS
#     Node6 - Client
#===============================================================================================
tests:
  - test:
      abort-on-fail: true
      clusters:
        ceph1:
          config:
            command: add
            copy_admin_keyring: true
            id: client.1
            install_packages:
              - ceph-common
              - ceph-fuse
            node: node7
        ceph2:
          config:
            command: add
            copy_admin_keyring: true
            id: client.1
            install_packages:
              - ceph-common
              - ceph-fuse
            node: node6
      desc: "Configure the Cephfs client system 1"
      destroy-cluster: false
      module: test_client.py
      name: "configure client"

  - test:
      name: setup cephfs mirroring
      desc: "Enable mirroring, add peer and paths — one-time setup before functional tests"
      module: cephfs_mirroring.setup_cephfs_mirroring.py
      abort-on-fail: true
      clusters:
        ceph1:
          config:
            source_fs: cephfs
            target_fs: cephfs
            target_user: mirror_remote
            target_site_name: remote_site

  - test:
      abort-on-fail: false
      desc: "Validate improved mirroring stats with dual-interface (asok + MGR) checks"
      clusters:
        ceph1:
          config:
            name: Validate improved mirroring stats for 9.2
      module: cephfs_mirroring.test_cephfs_mirror_improved_stats.py
      name: Validate improved mirroring stats for 9.2
      polarion-id: "CEPH-83575001"

  - test:
      abort-on-fail: false
      desc: "Validate sync failure and mid-sync daemon restart do not corrupt metrics"
      clusters:
        ceph1:
          config:
            name: Validate mirroring disruptive ops for 9.2
      module: cephfs_mirroring.test_cephfs_mirror_disruptive_ops.py
      name: Validate mirroring disruptive ops for 9.2
      polarion-id: "CEPH-83575002"

  - test:
      abort-on-fail: false
      desc: "Validate asok mirroring metrics (schema, sync-mode, ETA, crawl, failure, snapdiff)"
      clusters:
        ceph1:
          config:
            name: Validate asok mirroring metrics for 9.2 enhancements
      module: cephfs_mirroring.test_cephfs_mirror_asok_metrics_92.py
      name: Validate asok mirroring metrics for 9.2 enhancements
      polarion-id: "CEPH-83632744"

  - test:
      abort-on-fail: false
      desc: "Validate MGR mirror status interface (OMAP, stale, cache, CLI sanity)"
      clusters:
        ceph1:
          config:
            name: Validate MGR mirror status interface for 9.2
      module: cephfs_mirroring.test_cephfs_mirror_mgr_interface_92.py
      name: Validate MGR mirror status interface for 9.2
      polarion-id: "CEPH-83632824"

  - test:
      abort-on-fail: false
      desc: "Validate mirroring checkpoint commands (lifecycle, state transitions, pruning)"
      clusters:
        ceph1:
          config:
            name: Validate mirroring checkpoints for 9.2
      module: cephfs_mirroring.test_cephfs_mirror_checkpoints_92.py
      name: Validate mirroring checkpoints for 9.2
      polarion-id: "CEPH-83632782"

  - test:
      abort-on-fail: false
      desc: "Validate enhanced cephfs_mirror_directory perf counters (schema, lifecycle, BPS)"
      clusters:
        ceph1:
          config:
            name: Validate enhanced perf dump counters for 9.2
      module: cephfs_mirroring.test_cephfs_mirror_perf_dumps_92.py
      name: Validate enhanced perf dump counters for 9.2
      polarion-id: "CEPH-83632798"

  - test:
      abort-on-fail: false
      desc: "Validate tri-interface consistency (asok vs MGR vs perf counters)"
      clusters:
        ceph1:
          config:
            name: Validate tri-interface consistency for 9.2
      module: cephfs_mirroring.test_cephfs_mirror_tri_interface_92.py
      name: Validate tri-interface consistency for 9.2
      polarion-id: "CEPH-83632819"

  - test:
      name: teardown cephfs mirroring
      desc: "Disable mirroring and remove peer — cleanup after all functional tests"
      module: cephfs_mirroring.teardown_cephfs_mirroring.py
      abort-on-fail: false
      clusters:
        ceph1:
          config:
            source_fs: cephfs
            target_fs: cephfs
            target_user: mirror_remote
